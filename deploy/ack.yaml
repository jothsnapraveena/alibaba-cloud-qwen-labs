apiVersion: v1
kind: Namespace
metadata:
  name: qwen-labs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-data
  namespace: qwen-labs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-runbooks
  namespace: qwen-labs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen-runbooks
  template:
    metadata:
      labels:
        app: qwen-runbooks
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: api
          image: registry.example.com/REPLACE_ME/qwen-community-labs:0.2
          command: [python, -m, qwenlabs.operations]
          args: [serve, --host, 0.0.0.0, --db, /data/platform.sqlite, --seed-demo]
          ports:
            - containerPort: 8080
          env:
            - name: LAB_API_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: mapping
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-data
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-runbooks
  namespace: qwen-labs
spec:
  type: ClusterIP
  selector:
    app: qwen-runbooks
  ports:
    - port: 80
      targetPort: 8080
